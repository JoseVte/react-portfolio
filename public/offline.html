<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <meta name="robots" content="noindex" />
    <title>You are offline</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #18181b;
            color: #f4f4f5;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        .card { max-width: 28rem; }
        .logo { width: 96px; height: 96px; border-radius: 9999px; margin: 0 auto 24px; display: block; }
        h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.02em; }
        p { margin: 0 0 24px; color: #a1a1aa; line-height: 1.6; }
        button {
            appearance: none;
            border: 1px solid #3f3f46;
            border-radius: 9999px;
            background: #27272a;
            color: #fafafa;
            font: inherit;
            font-weight: 500;
            padding: 10px 24px;
            cursor: pointer;
            transition: background 150ms ease, border-color 150ms ease;
        }
        button:hover { background: #3f3f46; border-color: #52525b; }
        .status { margin-top: 20px; font-size: 0.875rem; color: #71717a; }
    </style>
</head>
<body>
<div class="card">
    <img class="logo" src="/icons/icon-192.png" alt="" width="96" height="96" />
    <h1>You are offline</h1>
    <p>This page could not be loaded because there is no internet connection. It will come back as soon as you are online again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p class="status" id="status"></p>
</div>
<script>
    (function () {
        var status = document.getElementById('status');

        function render() {
            status.textContent = navigator.onLine ? 'Connection available, press Try again.' : 'Waiting for a connection…';
        }

        // Only reload once the connection actually comes back. Reloading on load instead
        // would put this page in a loop whenever it is opened while already online.
        window.addEventListener('online', function () {
            render();
            window.location.reload();
        });
        window.addEventListener('offline', render);
        render();
    })();
</script>
</body>
</html>
